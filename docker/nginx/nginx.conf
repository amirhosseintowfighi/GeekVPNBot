user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON access log so it lands in the same pipeline as the app logs and
    # carries the same correlation id.
    log_format json_combined escape=json
      '{"ts":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
      '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
      '"duration_ms":$request_time,"upstream_ms":"$upstream_response_time",'
      '"referer":"$http_referer","user_agent":"$http_user_agent",'
      '"correlation_id":"$request_id"}';

    access_log /var/log/nginx/access.log json_combined;

    # Docker's embedded DNS. Required because every proxy_pass below names its
    # target through a variable, which is what defers name resolution to
    # request time. With a literal hostname nginx resolves at *config load* and
    # refuses to start if even one backend is absent - so a stopped blue/green
    # colour, or a front-end container that does not exist in this stack at
    # all, took the whole edge down and with it the API that was running fine.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 8m;
    client_body_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    # Shared rate-limit zones. Applied per-location in conf.d.
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=webhook_zone:10m rate=50r/s;
    # Admin surfaces get their own zone. Sharing api_zone would let ordinary
    # customer traffic exhaust the budget an operator needs during an incident,
    # which is exactly when the panel must stay usable.
    limit_req_zone $binary_remote_addr zone=admin_zone:10m rate=30r/s;

    # Connection cap alongside the request-rate caps. A rate limit alone does not
    # stop a slow-loris client: it opens sockets without completing requests, so
    # it never trips a per-second counter.
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
    limit_conn conn_zone 60;

    # Refusals answer 429, not the default 503. A 503 tells the client (and any
    # monitoring in front of us) that the service is down, when in fact it is
    # working correctly and declining this particular caller.
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    include /etc/nginx/conf.d/*.conf;
}
