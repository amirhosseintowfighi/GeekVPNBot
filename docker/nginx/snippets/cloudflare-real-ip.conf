# The visitor's address when the domain is proxied through Cloudflare.
#
# Behind Cloudflare every request arrives from a Cloudflare address. Without
# this, the per-IP rate limits would throttle all customers as a handful of
# "clients", and an admin allowlist (ADMIN_ALLOW_CIDRS) would see Cloudflare
# instead of the operator and refuse everyone.
#
# Safe with or without Cloudflare: the header is believed only from these
# ranges, so a visitor connecting directly cannot claim another address with
# it. Cloudflare's published list - https://www.cloudflare.com/ips/ - which
# changes rarely; refresh it from there if Cloudflare announces new ranges.
real_ip_header CF-Connecting-IP;

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
