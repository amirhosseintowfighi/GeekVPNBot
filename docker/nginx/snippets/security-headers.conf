# Edge security headers.
#
# The application sets these too, on purpose. Defence in depth: a
# misconfigured proxy or a static file served directly by nginx never passes
# through the application middleware. Where both set a header, nginx's
# `always` wins for error responses that never reach the app.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HSTS with a two-year max-age and subdomains. Deliberately NOT preloaded:
# preloading is effectively irreversible, and this domain may need to serve a
# plain-HTTP host during an incident.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
