# TLS parameters, shared by every server block.
#
# TLS 1.2 is still enabled. Dropping to 1.3-only would be stronger, and it would
# also lock out older Android devices, which are a real and significant share of
# this customer base in Iran. The 1.2 cipher list is restricted to forward-secret
# AEAD suites only, so the compromise costs handshake variety, not confidentiality.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
# Tickets off: they undermine forward secrecy unless the ticket key is rotated,
# and nginx never rotates it on its own.
ssl_session_tickets off;

# OCSP stapling. Without the resolver line the stapling silently does nothing,
# which is the usual reason a config that looks correct scores badly.
ssl_stapling on;
ssl_stapling_verify on;
# Docker's DNS alone. This snippet is included in every HTTPS server block,
# so its resolver also decides how `$active_api` (api_blue/api_green) is
# looked up there. With a public server in the list, nginx sent some of those
# lookups to it, cached the "Host not found", and answered 502 at random.
# Docker forwards external names (the OCSP responder) on its own.
resolver 127.0.0.11 ipv6=off valid=300s;
resolver_timeout 5s;

ssl_dhparam /etc/nginx/tls/dhparam.pem;
