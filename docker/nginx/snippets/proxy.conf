# Shared proxy parameters.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID      $request_id;
proxy_set_header Connection        "";

# Buffering on: a slow client must not hold an application worker open. This is
# the difference between one slow mobile connection and one occupied worker.
proxy_buffering on;
proxy_buffers 8 16k;
proxy_buffer_size 16k;

proxy_connect_timeout 5s;
proxy_send_timeout 30s;

# Retry on connection-level failures only. Retrying a request that already
# reached the application would double-submit payments, which is why
# non_idempotent is deliberately absent.
#
# Since the targets became variables there is no upstream group to fail over
# to, so this only applies when a name resolves to more than one address. Kept
# because it costs nothing and is correct if upstream blocks ever return.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
