# ---------------------------------------------------------------------------
# HTTP: redirect everything except the ACME challenge.
#
# The challenge path must stay on plain HTTP and must NOT redirect. Getting this
# wrong is the single most common way a working HTTPS site goes down months
# later: the certificate simply fails to renew on day ninety.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ${PRIMARY_DOMAIN} ${ADMIN_DOMAIN} ${MINIAPP_DOMAIN};

    # $active_api, for /edge-check below. Same one-line file the 443 block reads.
    include /etc/nginx/conf.d/active-api.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # Nginx's own liveness, on HTTP so the container healthcheck needs no cert.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # How scripts/deploy.sh confirms that a request entering the edge reaches
    # the colour it just switched to. It has to live here, on port 80 and
    # without a redirect: the previous check asked for /health/ready over HTTP
    # with a Host of `localhost`, which matches no server_name, fell through to
    # `location /` below, and got a 301 to HTTPS - where the only certificate
    # on a fresh install is the self-signed bootstrap one. So every first
    # install "failed to verify" and rolled itself back, for reasons that had
    # nothing to do with whether routing worked.
    #
    # Loopback only. This exposes the dependency detail in /health/ready, which
    # belongs on the inside.
    location = /edge-check {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$active_api:8000/health/ready;
    }

    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# API - primary domain.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${PRIMARY_DOMAIN};

    ssl_certificate         /etc/letsencrypt/live/${PRIMARY_DOMAIN}/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/${PRIMARY_DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${PRIMARY_DOMAIN}/chain.pem;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    include /etc/nginx/conf.d/active-api.conf;

    # Telegram webhook. Its own zone with a large burst: Telegram delivers in
    # bursts after any downtime, and throttling it loses user messages for good,
    # because Telegram retries only a limited number of times.
    location /telegram/ {
        set $bot_upstream bot:8081;
        limit_req zone=webhook_zone burst=200 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$bot_upstream;
        proxy_read_timeout 30s;
    }

    # Health endpoints: never rate limited, never logged. Throttling these lets
    # the limiter push a healthy container out of rotation mid-deploy, turning a
    # rolling update into an outage.
    location = /health/live {
        access_log off;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$active_api:8000;
    }

    location = /health/ready {
        access_log off;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$active_api:8000;
    }

    # Internal-only. Metrics are not secret like a password, but they do leak
    # revenue shape, customer counts and internal path names. Prometheus scrapes
    # them over the internal Docker network instead.
    location = /metrics { access_log off; return 404; }

    # Receipt upload. 6m rather than the global 8m, matching MAX_RECEIPT_BYTES
    # plus multipart overhead, so an oversized upload is refused at the edge
    # instead of occupying a Python worker for the whole transfer.
    location /api/v1/payments/ {
        client_max_body_size 6m;
        limit_req zone=api_zone burst=20 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$active_api:8000;
        proxy_read_timeout 60s;
    }

    # Admin API. An edge allowlist in addition to the application's, because the
    # cheapest place to refuse a request is before it reaches Python. Templated
    # at container start from ADMIN_ALLOW_CIDRS; when that is empty the file
    # resolves to a comment and the application middleware is the only gate.
    location /api/v1/admin/ {
        include /etc/nginx/conf.d/admin-allow.conf;
        limit_req zone=admin_zone burst=30 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$active_api:8000;
        proxy_read_timeout 120s;   # analytics exports are slow by nature
    }

    location / {
        limit_req zone=api_zone burst=40 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$active_api:8000;
        proxy_read_timeout 60s;
    }
}

# ---------------------------------------------------------------------------
# Mini App - opened inside Telegram's in-app browser.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${MINIAPP_DOMAIN};

    ssl_certificate         /etc/letsencrypt/live/${PRIMARY_DOMAIN}/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/${PRIMARY_DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${PRIMARY_DOMAIN}/chain.pem;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # X-Frame-Options DENY from the shared snippet would break the Mini App:
    # Telegram loads it in a frame. Overridden to allow exactly Telegram's
    # origins and nothing else. add_header replaces the inherited value.
    add_header X-Frame-Options "" always;
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://telegram.org" always;

    location / {
        set $miniapp_upstream miniapp:3000;
        limit_req zone=api_zone burst=60 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$miniapp_upstream;
    }
}

# ---------------------------------------------------------------------------
# Admin panel. Separate hostname so the edge allowlist covers the UI too.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${ADMIN_DOMAIN};

    ssl_certificate         /etc/letsencrypt/live/${PRIMARY_DOMAIN}/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/${PRIMARY_DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${PRIMARY_DOMAIN}/chain.pem;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    include /etc/nginx/conf.d/admin-allow.conf;

    location / {
        set $admin_upstream admin:3001;
        limit_req zone=admin_zone burst=60 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://$admin_upstream;
    }
}

# ---------------------------------------------------------------------------
# Default server: anything addressed to an unknown hostname.
#
# Without this, a request with an unrecognised Host header falls through to the
# first server block, which means the API answers on any domain pointed at this
# IP - including someone else's.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate         /etc/letsencrypt/live/${PRIMARY_DOMAIN}/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/${PRIMARY_DOMAIN}/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    return 421;   # Misdirected Request
}
