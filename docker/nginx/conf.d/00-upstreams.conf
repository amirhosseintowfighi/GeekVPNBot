# Backend addresses.
#
# There are deliberately no `upstream` blocks here any more. Nginx resolves the
# hostname in `server <host>:<port>` when it *loads* the config, and refuses to
# start - or to accept a reload - if any one of them does not resolve. That is
# fatal for this stack for two separate reasons:
#
#   * blue/green means one of api_blue / api_green is stopped by design, and a
#     stopped container has no DNS entry, so every reload after the first
#     deploy would have failed;
#   * `admin` and `miniapp` are not services in this compose stack at all, so
#     the config could never load on any host.
#
# The result was an edge that refused to start because a backend it was not
# being asked to serve did not exist, while the API sat beside it answering
# /health/ready with 200.
#
# Each proxy_pass in templates/geekvpn.conf names its target through a variable
# instead. Nginx then resolves at request time using the resolver configured in
# nginx.conf, and an absent backend is a 502 on that one route rather than a
# dead reverse proxy.
#
# The cost is upstream keepalive, which only `upstream` blocks provide. At this
# request volume the extra TCP handshake per request is not measurable; if it
# ever is, the fix is to declare upstreams for the containers that genuinely
# always run and leave the optional ones on variables.
#
# Which colour serves traffic lives in active-api.conf, which is bind-mounted
# from the host so scripts/deploy.sh can rewrite it and reload.
