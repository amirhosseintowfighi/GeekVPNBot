# Upstream definitions.
#
# Blue/green: both colours are declared, and active-api.conf decides which one
# the server blocks route to. Nginx is reloaded, not restarted, so requests
# already in flight on the old colour finish normally.
#
# The `resolve` parameter is deliberately absent: open-source nginx cannot
# re-resolve upstream hostnames at runtime, which is precisely why the colour
# switch is a config reload rather than a DNS change.

upstream api_blue {
    server api_blue:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream api_green {
    server api_green:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream geekvpn_bot {
    server bot:8081 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream geekvpn_admin {
    server admin:3001 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream geekvpn_miniapp {
    server miniapp:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}
